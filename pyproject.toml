[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rastro"
version = "0.1.0"
description = "Lê um HAR, identifica bibliotecas front-end e prioriza as falhas conhecidas."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rastro = "rastro.cli:principal"

[tool.setuptools.packages.find]
include = ["rastro*"]

[tool.setuptools.package-data]
"rastro.relatorio" = ["modelo.html"]
"rastro.ia" = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["rastro"]
