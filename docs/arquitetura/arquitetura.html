<title>Arquitetura do Rastro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fluxograma vertical à esquerda (passos 1 a 9 com o dado em cada seta); ao lado, o passo escolhido em três linhas: entra, faz, sai. */
:root {
  --fundo: #F5F8F9;
  --superficie: #FFFFFF;
  --texto: #142228;
  --texto-suave: #4E6670;
  --linha: #C3D2D8;
  --destaque: #0F5F7A;
  --destaque-fundo: #E1EEF2;
  --ia: #6B4FBB;
  --ia-fundo: #EEEAFA;
  --isolado: #8A6514;
  --isolado-fundo: #F7F0DF;
  --fonte-texto: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --fonte-titulo: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --fonte-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --raio: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #0E171B; --superficie: #16232A; --texto: #E3ECEF; --texto-suave: #9AB0B8;
    --linha: #2E434C; --destaque: #5BB9D4; --destaque-fundo: #173540;
    --ia: #B4A2F0; --ia-fundo: #2A2445; --isolado: #E2C27A; --isolado-fundo: #33291A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fundo: #0E171B; --superficie: #16232A; --texto: #E3ECEF; --texto-suave: #9AB0B8;
  --linha: #2E434C; --destaque: #5BB9D4; --destaque-fundo: #173540;
  --ia: #B4A2F0; --ia-fundo: #2A2445; --isolado: #E2C27A; --isolado-fundo: #33291A;
  color-scheme: dark;
}
body { background: var(--fundo); color: var(--texto); font: 15px/1.5 var(--fonte-texto); }
.pagina { max-width: 1180px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px; }
h1, h2 { font-family: var(--fonte-titulo); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; line-height: 1.15; }
h2 { font-size: 1.3rem; }
p { margin: 0; }
.abertura { display: grid; gap: 6px; }
.abertura p { color: var(--texto-suave); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .85rem; color: var(--texto-suave); }
.legenda span { display: inline-flex; align-items: center; gap: 8px; }
.amostra { width: 24px; height: 13px; border-radius: 2px; border: 1.5px solid var(--destaque); background: var(--destaque-fundo); }
.amostra.borda { background: var(--superficie); border-style: dashed; }
.amostra.ia { border-color: var(--ia); background: var(--ia-fundo); }
.amostra.isolado { border-color: var(--isolado); background: var(--isolado-fundo); border-style: dashed; }
.amostra.dado { width: 24px; height: 0; border: 0; border-top: 1.5px solid var(--texto-suave); border-radius: 0; background: none; }

.conteudo { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .conteudo { grid-template-columns: minmax(0, 1fr); } }
figure { margin: 0; }
.rolagem { overflow-x: auto; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); }
svg { display: block; min-width: 620px; width: 100%; height: auto; color: var(--texto); font-family: var(--fonte-texto); }

.no { cursor: pointer; }
.no rect.caixa { fill: var(--destaque-fundo); stroke: var(--destaque); stroke-width: 1.5; }
.no.borda rect.caixa { fill: var(--superficie); stroke-dasharray: 5 3; }
.no.ia rect.caixa { fill: var(--ia-fundo); stroke: var(--ia); }
.no.isolado rect.caixa { fill: var(--isolado-fundo); stroke: var(--isolado); stroke-dasharray: 5 3; }
.no.comando rect.caixa { fill: var(--texto); stroke: var(--texto); }
.no.comando text { fill: var(--fundo); font: 500 12.5px var(--fonte-mono); }
.no circle.numero { fill: var(--destaque); }
.no text.numero { font: 600 13px var(--fonte-titulo); fill: var(--superficie); }
.no text.titulo { font: 600 14px var(--fonte-titulo); fill: var(--texto); letter-spacing: .01em; }
.no text.pasta { font: 400 11.5px var(--fonte-mono); fill: var(--texto-suave); }
.no:hover rect.caixa, .no:focus-visible rect.caixa { stroke-width: 3; }
.no:focus { outline: none; }
.no.escolhido rect.caixa { stroke-width: 3.5; }
.no.comando.escolhido rect.caixa { stroke: var(--destaque); }

.seta { stroke: currentColor; stroke-width: 1.4; fill: none; opacity: .7; }
.seta.ia { stroke: var(--ia); opacity: 1; }
.seta.isolado { stroke: var(--isolado); opacity: 1; stroke-dasharray: 5 3; }
.seta.volta { stroke-dasharray: 3 3; }
.dado { font: 500 11.5px var(--fonte-mono); fill: var(--texto); }
.nota { font-size: 11px; fill: var(--texto-suave); }
.nota.ia { fill: var(--ia); }
.nota.isolado { fill: var(--isolado); }

.passo { position: sticky; top: max(16px, env(safe-area-inset-top, 0px)); background: var(--superficie); border: 1px solid var(--linha);
  border-radius: var(--raio); padding: 18px; display: grid; gap: 14px; }
.passo-topo { display: grid; gap: 4px; }
.contador { font: 500 .78rem var(--fonte-mono); color: var(--texto-suave); letter-spacing: .04em; }
.linhas { display: grid; gap: 10px; margin: 0; }
.linhas div { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: baseline; }
.linhas dt { font: 600 .72rem var(--fonte-titulo); text-transform: uppercase; letter-spacing: .08em; color: var(--texto-suave); }
.linhas dd { margin: 0; }
.arquivos { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.arquivos li { font: .8rem var(--fonte-mono); padding: 2px 8px; background: var(--fundo); border-radius: 2px; overflow-wrap: anywhere; }
.botoes { display: flex; gap: 8px; }
.botoes button { flex: 1; font: 500 .9rem var(--fonte-texto); padding: 8px 12px; border-radius: var(--raio); cursor: pointer;
  border: 1px solid var(--destaque); background: var(--superficie); color: var(--destaque); }
.botoes button.proximo { background: var(--destaque); color: var(--superficie); }
.botoes button:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
.botoes button:disabled { opacity: .4; cursor: default; }
@media (prefers-reduced-motion: no-preference) { .no rect.caixa { transition: stroke-width .12s; } }
</style>

};

let posicaoAtual = 1;

function desenharPasso(passo, contador) {
  document.getElementById("contador").textContent = contador;
  document.getElementById("titulo").textContent = passo.titulo;
  document.getElementById("entra").textContent = passo.entra;
  document.getElementById("faz").textContent = passo.faz;
  document.getElementById("sai").textContent = passo.sai;
  const lista = document.getElementById("arquivos");
  lista.replaceChildren();
  for (const arquivo of passo.arquivos) {
    const item = document.createElement("li");
    item.textContent = arquivo;
    lista.append(item);
  }
}

function marcarCaixa(chave) {
  for (const no of document.querySelectorAll(".no")) {
    no.classList.toggle("escolhido", no.dataset.no === chave);
  }
}

function irParaPosicao(posicao) {
  posicaoAtual = posicao;
  const passo = PASSOS[posicao];
  desenharPasso(passo, "Passo a passo · " + (posicao + 1) + " de " + PASSOS.length);
  marcarCaixa(passo.no);
  document.getElementById("anterior").disabled = posicao === 0;
  document.getElementById("proximo").disabled = posicao === PASSOS.length - 1;
}

function mostrarExtra(chave) {
  desenharPasso(EXTRAS[chave], "Fora do fluxo principal");
  marcarCaixa(chave);
}

function escolherCaixa(chave) {
  const posicao = PASSOS.findIndex((passo) => passo.no === chave);
  if (posicao >= 0) {
    irParaPosicao(posicao);
  } else {
    mostrarExtra(chave);
  }
}

for (const no of document.querySelectorAll(".no")) {
  no.addEventListener("click", () => escolherCaixa(no.dataset.no));
  no.addEventListener("keydown", (evento) => {
    if (evento.key === "Enter" || evento.key === " ") {
      evento.preventDefault();
      escolherCaixa(no.dataset.no);
    }
  });
}
document.getElementById("anterior").addEventListener("click", () => irParaPosicao(Math.max(0, posicaoAtual - 1)));
document.getElementById("proximo").addEventListener("click", () => irParaPosicao(Math.min(PASSOS.length - 1, posicaoAtual + 1)));
irParaPosicao(1);
</script>
